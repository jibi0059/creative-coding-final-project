<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moonlight Drift</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
  <script src="time-mechanic.js"></script>
  <script src="audio-mechanic.js"></script>
  <script src="perlin-mechanic.js"></script>
  <script src="input-mechanic.js"></script>
  <script src="sketch.js" defer></script>
</head>
<body>
  <div id="mechanic-toggles">
    <label><input type="checkbox" id="toggle-audio" checked> Audio</label>
    <label><input type="checkbox" id="toggle-perlin" checked> Perlin</label>
    <label><input type="checkbox" id="toggle-input" checked> Input</label>
    <label><input type="checkbox" id="toggle-time" checked> Time</label>
  </div>

  <main id="sketch-holder"></main>
</body>
</html>
